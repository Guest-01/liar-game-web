name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsx/vite는 타입을 검사하지 않는다. 이 단계가 없으면 타입 오류가
      # 런타임까지 숨는다 (체크리스트 G10).
      - name: 타입 검사
        run: npm run typecheck

      # 정보 은닉 바이트 테스트가 여기 포함된다 — 배포 게이트
      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build
